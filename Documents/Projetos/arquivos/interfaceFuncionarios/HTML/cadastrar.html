<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Funcionário</title>
    <link rel="stylesheet" href="../CSS/cadastro.css">
</head>
<body>
    <header>
        <h1>Adicionar Funcionário</h1>
        <nav>
            <a href="gestaofuncionarios.html">Início</a>
        </nav>
    </header>
    
    <main>
    <div class="form-container">
        <form id="formFuncionario">
            
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="matricula">Matrícula</label>
                <input type="text" id="matricula" name="matricula" required>
            </div>

            <div class="campo">
                <label for="cargo">Cargo</label>
                <input type="text" id="cargo" name="cargo" required>
            </div>
            <div class="campo">
                
                <label for="departamento">Departamento</label>
                <input type="text" id="departamento" name="departamento" required placeholder="Departamento">

            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            


            <button type="submit">Adicionar</button>
        </form>
    </div>
</main>
    

    <footer>
        <h2>&copy; MADE BY TH </h2>
    </footer>
   
    
 <script src="/arquivos/interfaceFuncionarios/JS/addfunc.js"></script>
 
</body>

    
</html>
